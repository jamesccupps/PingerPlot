name: Bug report
description: Something in PingerPlot doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time!

        If the numbers look wrong, say what you expected and why: a capture, `ping`/`tracert`/`mtr` output for the same path, or a saved session (**File → Save session…**) shows it best. Please replace any addresses you'd rather not post.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen, if you know
      placeholder: |
        1. Add a target with TCP mode, port 443
        2. Start it
        3. …
  - type: input
    id: version
    attributes:
      label: Version
      description: Help → About shows it
      placeholder: "1.3.3"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which copy
      options:
        - Windows executable (PingerPlot.exe)
        - Windows headless executable (pingerplot-headless.exe)
        - From source on Windows
        - From source on Linux
        - From source on macOS
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Probe mode
      options:
        - ICMP
        - TCP
        - UDP
        - Not about probing
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >
        Screenshots help, and so does the Events tab (or the headless output). A probe log or a saved session holds the
        addresses of every hop on the path: look it over before attaching it.
