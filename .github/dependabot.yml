# Actions are pinned by commit SHA (tags are mutable, and the release job holds
# a token that can publish). A pinned SHA goes stale silently, so Dependabot
# is what keeps them current -- it understands the `# v5` comment convention
# and updates both the SHA and the comment together.
#
# The app itself is deliberately dependency-free. The pip entry covers only
# the release job's build tooling, which is pinned by version and hash in
# packaging/requirements-build.txt and would otherwise go stale silently too.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "CI"
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Build"
