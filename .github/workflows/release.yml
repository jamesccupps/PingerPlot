name: Release binaries

# Build the Windows executables and attach them to the release for a tag.
#
# Runs on a tag push, and can be dispatched by hand against a tag that already
# exists (which is how v1.3.0 got its binaries after the fact).
#
# The binaries are built here rather than on somebody's laptop so that what
# people download is reproducible from a commit, and so the verification below
# is not optional. An early hand-built attempt shipped an exe that died at
# import because of an over-eager --exclude-module; the smoke tests in this
# workflow are the thing that makes that a red build instead of a download.
#
# Two hardening rules apply throughout, because this job holds contents:write
# and a token that can publish releases:
#
#   1. No ${{ }} interpolation inside a `run:` script. The runner substitutes
#      those into the script TEXT before bash ever sees it, so a dispatch input
#      containing shell metacharacters is executed. Values reach the shell
#      through `env:` instead, where bash reads them as data.
#   2. Actions are pinned by commit SHA, not by tag. Tags are mutable; a
#      retagged or compromised action would otherwise run here with that token.
#
# tests/test_packaging.py enforces both, so a later edit cannot quietly undo
# them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.3.1)"
        required: true
        type: string

permissions:
  contents: write   # uploading release assets needs write; nothing else does

jobs:
  windows:
    name: Windows executables
    runs-on: windows-latest

    steps:
      - name: Work out which tag we are building
        id: tag
        shell: bash
        env:
          # Via env, not ${{ }} inside run: -- see rule 1 at the top of the
          # file. `tag` is a free-text dispatch input, and this job can publish
          # releases.
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_INPUT:-$REF_NAME}"
          # Two checks, and the character-set one is not redundant. A glob's *
          # matches a newline, so "v1.3.1\ninjected=1" satisfies the version
          # shape below and then writes TWO lines into $GITHUB_OUTPUT --
          # inventing a step output that nothing here declared. Restricting the
          # characters first closes that and every quoting question with it.
          case "$TAG" in
            *[!A-Za-z0-9.+_-]*)
               echo "::error::refusing to build a tag containing characters"\
                    "outside A-Za-z0-9.+_-"
               exit 1 ;;
          esac
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to build '$TAG': expected a tag like v1.3.1"
               exit 1 ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      # Pinned by commit SHA, not tag: tags are mutable. Dependabot updates
      # these and the trailing comment says which version each SHA is.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Check this tag can actually be built
        # Dispatching against a tag from before packaging/ existed checks out a
        # tree with no build recipe, and the first thing to notice is whichever
        # step happens to touch a missing file -- which is a confusing way to
        # learn it. Say it plainly instead. (v1.3.0 is exactly this case.)
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if [ ! -f packaging/pingerplot.spec ]; then
            echo "::error::$TAG predates packaging/, which was added in 1.3.1 --"\
                 "there is no build recipe at that commit. Binaries can only be"\
                 "built for 1.3.1 and later."
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyinstaller pytest

      - name: Test the source before freezing it
        # Freezing a broken tree just produces a broken binary more slowly.
        run: python -m pytest -q -rs

      - name: Generate the application icon
        # Drawn from the same code as the in-app icon, so the two cannot drift.
        run: python packaging/make_icon.py build/pingerplot.ico

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/pingerplot.spec

      - name: Smoke-test the frozen GUI binary
        # --version exits before Tk is created, so this runs without a display
        # while still importing the whole graph: gui -> geoip -> urllib.request
        # -> email. A bad exclude fails right here.
        #
        # Start-Process -Wait -PassThru, NOT $LASTEXITCODE: PingerPlot.exe is a
        # GUI-subsystem binary, so PowerShell does not wait for it and
        # $LASTEXITCODE keeps whatever the previous command left behind. The
        # first version of this step read a stale 0 and would have passed a
        # broken build. Verified the other way too -- a deliberately broken
        # build (--exclude-module email) exits 1 here and prints its traceback.
        run: |
          $p = Start-Process .\dist\PingerPlot.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "frozen GUI exited $($p.ExitCode)" }
          Write-Host "GUI binary import graph OK"

      - name: Smoke-test the frozen headless binary
        # Goes further: a real ICMP probe to loopback through the frozen
        # backend, so the ctypes/iphlpapi path is exercised too, not just
        # imported.
        run: |
          .\dist\pingerplot-headless.exe --help
          if ($LASTEXITCODE -ne 0) { throw "frozen headless exited $LASTEXITCODE" }
          $cfg = "smoke.json"
          $json = '{ "status_interval": 0, "defaults": { "interval": 0.5, "timeout_ms": 1000, "max_hops": 4 }, "targets": [ { "target": "127.0.0.1", "final_hop_only": true } ] }'
          [IO.File]::WriteAllText("$PWD\$cfg", $json, (New-Object Text.UTF8Encoding $false))
          .\dist\pingerplot-headless.exe $cfg --report 2
          if ($LASTEXITCODE -ne 0) { throw "frozen headless probe exited $LASTEXITCODE" }
          Write-Host "headless binary probed loopback OK"

      - name: Checksums
        # Published alongside the binaries: they are unsigned, so a hash a
        # reader can compare is the only integrity story on offer.
        run: |
          cd dist
          Get-FileHash *.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Tee-Object -FilePath SHA256SUMS.txt
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pingerplot-windows-${{ steps.tag.outputs.name }}
          path: |
            dist/PingerPlot.exe
            dist/pingerplot-headless.exe
            dist/SHA256SUMS.txt

      - name: Attach to the release
        # gh is preinstalled on the runner, so no third-party action is needed
        # for this and the token stays scoped to this repository.
        #
        # Creates the release if it does not exist. Pushing a tag does NOT
        # create one -- GitHub leaves that to you -- so on the ordinary path
        # (tag a version, let CI build it) there is nothing to upload to yet,
        # and `gh release upload` alone fails with "release not found". Notes
        # come from the annotated tag message, which is written at tag time and
        # is the right place for them.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG yet; creating one from the tag message."
            gh release create "$TAG" --title "PingerPlot ${TAG#v}" --notes-from-tag --verify-tag
          fi
          gh release upload "$TAG" \
            dist/PingerPlot.exe \
            dist/pingerplot-headless.exe \
            dist/SHA256SUMS.txt \
            --clobber
          echo "Attached to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
