name: Release binaries

# Build the Windows executables and attach them to the release for a tag,
# with latest.json, the signed manifest the in-app updater reads.
#
# Runs on a tag push, and can be dispatched by hand against a tag that already
# exists (which is how v1.3.0 got its binaries after the fact). A dispatched
# run can only sign when it runs from the tag ("Use workflow from"): the
# release environment the authenticode job needs admits v* tags only.
#
# A tag ending in -signtest (e.g. v1.4.3-signtest.1, the version in the source
# plus the suffix) runs the same build, signing and tests and publishes
# nothing: for trying a change to signing without a release. Delete the tag
# afterwards.
#
# The binaries are built here rather than on somebody's laptop so that what
# people download is reproducible from a commit, and so the verification below
# is not optional. An early hand-built attempt shipped an exe that died at
# import because of an over-eager --exclude-module; the smoke tests in this
# workflow are the thing that makes that a red build instead of a download.
#
# Hardening, because this workflow ends in a token that can publish releases:
#
#   1. No ${{ }} interpolation inside a `run:` script. The runner substitutes
#      those into the script TEXT before bash ever sees it, so a dispatch input
#      containing shell metacharacters is executed. Values reach the shell
#      through `env:` instead, where bash reads them as data.
#   2. Actions are pinned by commit SHA, not by tag. Tags are mutable; a
#      retagged or compromised action would otherwise run with that token.
#   3. Third-party code never runs next to the write token or a signing
#      identity. The build job -- which installs PyInstaller and pytest and
#      executes them -- is read-only and has no secrets; the authenticode job,
#      which can sign as James Cupps, runs nothing from PyPI and never runs
#      the program; the sign job, which installs nothing, holds the
#      release-signing key; only the publish job, which runs nothing but gh,
#      can write.
#   4. Build tooling is pinned by version and hash (packaging/
#      requirements-build.txt), not "whatever PyPI serves today".
#   5. The checkout steps do not leave the job token in .git/config
#      (persist-credentials: false), where any later step could read it.
#
# tests/test_packaging.py enforces all five, so a later edit cannot quietly
# undo them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.3.1)"
        required: true
        type: string

# Read-only by default; the publish job alone asks for more.
permissions:
  contents: read

jobs:
  windows:
    name: Freeze the program
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      signtest: ${{ steps.tag.outputs.signtest }}

    steps:
      - name: Work out which tag we are building
        id: tag
        shell: bash
        env:
          # Via env, not ${{ }} inside run: -- see rule 1 at the top of the
          # file. `tag` is a free-text dispatch input, and this job can publish
          # releases.
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_INPUT:-$REF_NAME}"
          # Two checks, and the character-set one is not redundant. A glob's *
          # matches a newline, so "v1.3.1\ninjected=1" satisfies the version
          # shape below and then writes TWO lines into $GITHUB_OUTPUT --
          # inventing a step output that nothing here declared. Restricting the
          # characters first closes that and every quoting question with it.
          case "$TAG" in
            *[!A-Za-z0-9.+_-]*)
               echo "::error::refusing to build a tag containing characters"\
                    "outside A-Za-z0-9.+_-"
               exit 1 ;;
          esac
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing to build '$TAG': expected a tag like v1.3.1"
               exit 1 ;;
          esac
          case "$TAG" in
            *-signtest*) signtest=true ;;
            *) signtest=false ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "signtest=$signtest" >> "$GITHUB_OUTPUT"

      # Pinned by commit SHA, not tag: tags are mutable. Dependabot updates
      # these and the trailing comment says which version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.name }}
          persist-credentials: false

      - name: Check this tag can actually be built
        # Dispatching against a tag from before packaging/ existed checks out a
        # tree with no build recipe, and the first thing to notice is whichever
        # step happens to touch a missing file -- which is a confusing way to
        # learn it. Say it plainly instead. (v1.3.0 is exactly this case.)
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if [ ! -f packaging/pingerplot.spec ]; then
            echo "::error::$TAG predates packaging/, which was added in 1.3.1 --"\
                 "there is no build recipe at that commit. Binaries can only be"\
                 "built for 1.3.1 and later."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        # Exact versions with hashes, wheels only: a changed or substituted
        # file fails here rather than running inside the build.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt

      - name: Check the tag matches the version
        # An installer whose Settings > Apps entry, Properties and About box
        # disagree with its own download name is a support question waiting.
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          v=$(python -c "from pingerplot import __version__; print(__version__)")
          case "$TAG" in
            "v$v") ;;
            "v$v-signtest"*)
              echo "::notice::$TAG is a signing test of $v: built, signed and tested, never published" ;;
            *)
              echo "::error::$TAG does not match pingerplot.__version__ ($v)"
              exit 1 ;;
          esac

      - name: Test the source before freezing it
        # Freezing a broken tree just produces a broken binary more slowly.
        run: python -m pytest -q -rs

      - name: Freeze the program folder
        # build_windows.py --program draws the icon (from the same code as the
        # in-app one), writes the version resource and runs PyInstaller. The
        # zip and the installer are made around the signed exes, in the
        # authenticode job.
        run: python packaging/build_windows.py --program

      - name: Smoke-test the frozen GUI binary
        # --version exits before Tk is created, so this runs without a display
        # while still importing the whole graph: gui -> geoip -> urllib.request
        # -> email. A bad exclude fails right here.
        #
        # Start-Process -Wait -PassThru, NOT $LASTEXITCODE: PingerPlot.exe is a
        # GUI-subsystem binary, so PowerShell does not wait for it and
        # $LASTEXITCODE keeps whatever the previous command left behind. The
        # first version of this step read a stale 0 and would have passed a
        # broken build. Verified the other way too -- a deliberately broken
        # build (--exclude-module email) exits 1 here and prints its traceback.
        run: |
          $p = Start-Process .\dist\PingerPlot\PingerPlot.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "frozen GUI exited $($p.ExitCode)" }
          Write-Host "GUI binary import graph OK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pingerplot-program-${{ steps.tag.outputs.name }}
          path: dist/PingerPlot
          if-no-files-found: error

  authenticode:
    # PingerPlot.exe and pingerplot-headless.exe, the uninstaller and
    # Setup.exe signed by James Cupps: Azure Artifact Signing, the account and
    # certificate profile Slate and NoteForge sign with. Azure accepts GitHub's
    # OIDC token for it only from this repository's "release" environment
    # (subject repo:jamesccupps/PingerPlot:environment:release), and the
    # environment only v* tags, so no password or key is stored anywhere; the
    # AZURE_* secrets just say which app registration ("Slate signing").
    #
    # What runs here: GitHub's and Microsoft's actions (pinned), Microsoft's
    # ArtifactSigning module (pinned version), Inno Setup from the runner image
    # and this tag's packaging code, which is standard library. Nothing from
    # PyPI, and the program is never run: it is signed as the windows job froze
    # it, and the zip and the installer are made around it
    # (build_windows.py --package --sign).
    name: Sign the programs and make the downloads
    needs: windows
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # the OIDC token Azure signs in with

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.windows.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pingerplot-program-${{ needs.windows.outputs.tag }}
          path: dist/PingerPlot

      - name: Inno Setup is on the runner
        # The Windows runner image carries Inno Setup 6. Not installed here if
        # it's gone (CI's package job does that): this job can sign.
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup 6 isn't on the runner image any more"
          }

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The version packaging/authenticode.ps1 imports
      - name: Install the ArtifactSigning module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force

      - name: Sign the exes, then make the zip and the installer around them
        # The exes are signed first, so the zip and Setup.exe carry signed
        # copies; Inno Setup signs the uninstaller and Setup.exe as it makes
        # them; the checksums (and later latest.json) are of the signed files.
        run: python -I packaging/build_windows.py --package --sign

      - name: Checksums
        # Published alongside the downloads, so a reader can compare a file
        # with the release's own list.
        shell: pwsh
        run: Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pingerplot-windows-${{ needs.windows.outputs.tag }}
          path: |
            dist/PingerPlot-Setup.exe
            dist/PingerPlot-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  verify:
    # The downloads exactly as they'll be published: every exe in them signed
    # by James Cupps and timestamped, and the signed programs still working.
    name: Test the signed downloads
    needs: [windows, authenticode]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PUBLISHER: "CN=James Cupps, O=James Cupps"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.windows.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pingerplot-windows-${{ needs.windows.outputs.tag }}
          path: dist

      - name: Smoke-test the frozen headless binary, from the portable zip
        # The zip as people will download it: unzipped to a scratch folder, its
        # exes' signatures, its GUI's --self-test (builds the window,
        # round-trips settings in its own folder, probes loopback, makes the
        # tray icons) and a real ICMP probe of loopback through the frozen
        # headless runner.
        shell: pwsh
        run: ./packaging/test_portable.ps1 -Publisher $env:PUBLISHER

      - name: Install, self-test and uninstall the installer
        # Setup.exe's signature and those of every exe it installs, the
        # uninstaller too, before it runs them.
        shell: pwsh
        run: |
          $v = python -c "from pingerplot import __version__; print(__version__)"
          ./packaging/test_installer.ps1 -Setup dist\PingerPlot-Setup.exe -Version $v -Publisher $env:PUBLISHER

      - name: Update an older copy to these files
        # These exact files, signed for the test with a throwaway key (never
        # the release key, which this job doesn't have): a release that the
        # previous one -- or, until there is one with an updater, this build
        # itself -- can't update to is never published.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/test_update.ps1

  sign:
    # latest.json: the manifest installed copies update from, signed with the
    # release key (the UPDATE_SIGNING_KEY secret). Its own job, for the same
    # reason the publish job is one: the key never shares a job with pip,
    # PyInstaller or the test suite. This job installs nothing; it runs the
    # runner's own Python on the tag's packaging/signing.py, which is
    # standard library only, and checks the result against the public key
    # built into the app before anything is published.
    name: Sign the update manifest
    needs: [windows, verify]
    if: needs.windows.outputs.signtest != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.windows.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pingerplot-windows-${{ needs.windows.outputs.tag }}
          path: dist

      - name: Sign latest.json
        # A tag from before the updater (1.4.0) has no signing.py and nothing
        # that would read a manifest, so it gets none. From 1.4.0 on, a
        # missing secret fails the release: unsigned, it would never reach
        # installed copies, and nobody would notice.
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          if [ ! -f packaging/signing.py ]; then
            echo "$TAG predates the in-app updater; no latest.json."
            exit 0
          fi
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret isn't set (see packaging/signing.py)."
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          PINGERPLOT_SIGNING_KEY="$key" python3 -I packaging/signing.py sign dist "$TAG"

      - name: Verify latest.json against the key built into the app
        # A release signed with the wrong key would be refused by every
        # installed copy; this is where that is caught instead.
        shell: bash
        env:
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          if [ -f packaging/signing.py ]; then
            python3 -I packaging/signing.py verify dist "$TAG"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pingerplot-manifest-${{ needs.windows.outputs.tag }}
          path: dist/latest.json
          if-no-files-found: ignore

  publish:
    # Separate from the build so the token that can publish releases never
    # shares a job with pip, PyInstaller or the test suite. This job runs
    # only actions pinned by SHA and gh, which is preinstalled on the runner.
    name: Attach to the release
    needs: [windows, authenticode, verify, sign]
    if: needs.windows.outputs.signtest != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating a release and uploading its assets

    steps:
      # The tag's checkout is needed for --notes-from-tag, which reads the
      # annotated tag's message locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.windows.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pingerplot-windows-${{ needs.windows.outputs.tag }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        # Absent for a tag from before the updater; the upload below copes.
        continue-on-error: true
        with:
          name: pingerplot-manifest-${{ needs.windows.outputs.tag }}
          path: dist

      - name: Attach to the release
        # gh is preinstalled on the runner, so no third-party action is needed
        # for this and the token stays scoped to this repository.
        #
        # Creates the release if it does not exist. Pushing a tag does NOT
        # create one -- GitHub leaves that to you -- so on the ordinary path
        # (tag a version, let CI build it) there is nothing to upload to yet,
        # and `gh release upload` alone fails with "release not found". The
        # text is release-notes/<tag>.md when there is one (written with the
        # release, like the siblings'), otherwise the annotated tag's message.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="release-notes/$TAG.md"
            if [ -f "$notes" ]; then
              echo "No release for $TAG yet; creating one from $notes."
              gh release create "$TAG" --title "PingerPlot ${TAG#v}" --notes-file "$notes" --verify-tag
            else
              echo "No release for $TAG yet; creating one from the tag message."
              gh release create "$TAG" --title "PingerPlot ${TAG#v}" --notes-from-tag --verify-tag
            fi
          fi
          files=(dist/PingerPlot-Setup.exe dist/PingerPlot-win64.zip dist/SHA256SUMS.txt)
          # latest.json goes up last: installed copies read it the moment it
          # appears, and the files it names must already be there.
          if [ -f dist/latest.json ]; then files+=(dist/latest.json); fi
          for f in "${files[@]}"; do
            gh release upload "$TAG" "$f" --clobber
          done
          echo "Attached to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
