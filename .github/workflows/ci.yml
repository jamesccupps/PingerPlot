name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The runtime app is Windows-only (Win32 ICMP API), but the test suite
        # is platform-independent (the DLL access is guarded behind sys.platform),
        # so we prove it builds + tests cleanly on Linux and Windows.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pinned by commit SHA, not tag: tags are mutable. Dependabot updates
      # these and the trailing comment says which version each SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Check the release build lock still resolves (Windows, py3.12)
        # The release job installs packaging/requirements-build.txt with
        # --require-hashes. Resolving it here means a bad bump or a missing
        # transitive pin turns a push red, not the next tagged release.
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: |
          python -m pip install --dry-run --require-hashes --only-binary=:all: -r packaging/requirements-build.txt

      - name: Allow unprivileged ICMP sockets (Linux)
        # Without this the POSIX backend's live tests skip on every ubuntu leg,
        # which is how they shipped: the backend had never executed a single
        # socket operation anywhere. GitHub's runners deny SOCK_DGRAM/ICMP to
        # the runner's group by default; opening ping_group_range is the same
        # one-liner the app tells a user to run, and it needs no privilege
        # beyond the passwordless sudo the runner already grants.
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Report ICMP backend availability
        # Printed so a CI log answers "did the live POSIX tests actually run,
        # or did they all skip?" A group that silently skips on half the matrix
        # is not covering what it appears to.
        run: >
          python -c "from pingerplot import icmp, icmp_posix;
          print('icmp.is_available:', icmp.is_available());
          print('posix backend    :', icmp_posix.is_available());
          print('reason           :', icmp.unavailable_reason() or '(none)')"

      - name: Install a display and Tk (Linux)
        # gui.py is 1,470 lines and was untested on the grounds that it imports
        # tkinter at module level. Tk is testable headlessly: python3-tk plus a
        # virtual framebuffer is the whole requirement, and it is what lets the
        # session/settings tests below run at all. Windows runners already have
        # both.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk xvfb

      - name: Run tests (Linux, under a virtual framebuffer)
        # -rs lists every skipped test with its reason, so a leg of the matrix
        # that quietly covers less than it looks like is visible in the log.
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -rs

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -q -rs

  package:
    # The release files built and tested on every push, so a change that
    # breaks the installer or the portable zip turns a push red, not the next
    # tagged release. Unsigned, never published: the artifact is for looking at.
    name: Windows installer and portable zip
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt

      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        run: python packaging/build_windows.py

      - name: Self-test the portable zip
        shell: pwsh
        run: ./packaging/test_portable.ps1

      - name: Install, self-test and uninstall the installer
        shell: pwsh
        run: |
          $v = python -c "from pingerplot import __version__; print(__version__)"
          ./packaging/test_installer.ps1 -Setup dist\PingerPlot-Setup.exe -Version $v

      - name: Update an older copy to this build
        # The previous release with an updater (or this build itself, until
        # there is one) updates to these files, portable and installed, with a
        # throwaway key standing in for the release key.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/test_update.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PingerPlot-windows
          path: |
            dist/PingerPlot-Setup.exe
            dist/PingerPlot-win64.zip
            dist/SHA256SUMS.txt
          retention-days: 7
