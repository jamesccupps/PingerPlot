# Actions are pinned by commit SHA (tags are mutable, and the release job holds
# a token that can publish). A pinned SHA goes stale silently, so Dependabot
# is what keeps them current -- it understands the `# v5` comment convention
# and updates both the SHA and the comment together.
#
# The app itself is deliberately dependency-free. The pip entry covers only
# build tooling, pinned by version and hash, which would otherwise go stale
# silently too: the release job's (packaging/requirements-build.txt) and the
# PyPI package's (packaging/requirements-pypi.txt, from requirements-pypi.in).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "CI"
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Build"
