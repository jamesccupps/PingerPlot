name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The runtime app is Windows-only (Win32 ICMP API), but the test suite
        # is platform-independent (the DLL access is guarded behind sys.platform),
        # so we prove it builds + tests cleanly on Linux and Windows.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Allow unprivileged ICMP sockets (Linux)
        # Without this the POSIX backend's live tests skip on every ubuntu leg,
        # which is how they shipped: the backend had never executed a single
        # socket operation anywhere. GitHub's runners deny SOCK_DGRAM/ICMP to
        # the runner's group by default; opening ping_group_range is the same
        # one-liner the app tells a user to run, and it needs no privilege
        # beyond the passwordless sudo the runner already grants.
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Report ICMP backend availability
        # Printed so a CI log answers "did the live POSIX tests actually run,
        # or did they all skip?" A group that silently skips on half the matrix
        # is not covering what it appears to.
        run: >
          python -c "from pingerplot import icmp, icmp_posix;
          print('icmp.is_available:', icmp.is_available());
          print('posix backend    :', icmp_posix.is_available());
          print('reason           :', icmp.unavailable_reason() or '(none)')"

      - name: Run tests
        # -rs lists every skipped test with its reason, so a leg of the matrix
        # that quietly covers less than it looks like is visible in the log.
        run: python -m pytest -q -rs
